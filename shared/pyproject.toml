[project]
name = "shared"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "duckdb>=1.0",
    # >=1.36 for the checksum-calculation knob R2 needs (see shared/s3/client.py).
    "boto3>=1.36",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["shared*"]
