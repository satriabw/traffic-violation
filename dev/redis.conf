# Redis for local development. Run from the repo root:
#
#   redis-server dev/redis.conf
#
# Nothing global: no `brew services`, no launchd job, no state outside the repo.
# Ctrl-C stops it and takes the queue with it. site-service and detection-worker
# run directly on the host — this is the only piece that needs a server.

bind 127.0.0.1
port 6379

# Relative to the working directory, so start it from the repo root. data/ is
# already gitignored, alongside the DuckDB file.
dir ./data

# No persistence. A detection job is a request to do work now — a queue restored
# from a dump replays jobs whose video may be long gone, and it hides the fact
# that nothing ever consumed them.
save ""
appendonly no
