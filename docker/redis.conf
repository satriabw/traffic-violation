# Redis for local development. Run from the repo root, either way:
#
#   docker compose up redis           # Linux, this conf inside the container
#   redis-server docker/redis.conf    # macOS, against `brew install redis`
#
# It lives under docker/ with the two Dockerfiles because the container is what
# reads it in every case but the macOS one — there is no longer a dev/ holding a
# hand-written `docker run` for it to belong to.
#
# Nothing global: no `brew services`, no launchd job, no systemd unit, no state
# outside the repo. Ctrl-C stops it and takes the queue with it.

bind 127.0.0.1
port 6379

# Relative to the working directory, which is the repo root on the host and /repo in
# the container — compose sets `working_dir` to match, so this one line resolves the
# same on both. data/ is already gitignored.
dir ./data

# No persistence. A detection job is a request to do work now — a queue restored
# from a dump replays jobs whose video may be long gone, and it hides the fact
# that nothing ever consumed them.
save ""
appendonly no
