[project]
name = "detection-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Headless: the worker never opens a window, and the GUI build pulls in GTK for
    # nothing. The wheel still carries the ffmpeg backend, which is what lets
    # VideoCapture open an http url.
    "opencv-python-headless>=4.9",
    "numpy",
    # Inference only. Notably NOT torch: the research pipeline imports torch,
    # torchvision and transformers to reach the same ONNX session, and none of it is
    # needed once preprocessing is cv2 and numpy. See detection_worker.detection.model.
    "onnxruntime>=1.17",
    # For sv.Detections (the type detector and tracker pass between them) and
    # sv.ByteTrack. Capped below 0.31, which removes ByteTrack — the successor lives
    # in the `trackers` package and depends on opencv-python, which would collide
    # with the headless build above. detection_worker.detection.tracker is the only
    # place that has to change when we migrate.
    "supervision>=0.26,<0.31",
    # Ground-plane positions and speeds from tracked boxes. A separate distribution
    # rather than another module in here because the same code has been copied into
    # several projects: it depends on nothing in this repository, so the day a second
    # one needs it, it moves out whole. See packages/trajectory-collector.
    "trajectory-collector",
    # The rules themselves, and for the same reason: this code came from another
    # project and is meant to be liftable back out, so it depends on nothing in this
    # repository — not shared, not this worker, and no detection library. The two
    # adapters in analysis.frame_analyzer are the whole of the boundary.
    "violation-detector",
    # The few seconds leading up to a violation, kept as records rather than pixels.
    # A third distribution on the same terms as the two above, and the only one with no
    # dependencies at all — keeping a ring of the recent past is a deque and some
    # tuples. `_object_states` in analysis.frame_analyzer is the whole of its boundary.
    "evidence-collector",
    # boto3 (to sign its own download urls), the job model, and the shared database
    # connection all come with shared. Still no http client: the worker reads the same
    # SQLite file as site-service but never calls it — see detection_worker.db.
    "shared",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["detection_worker*"]
