[project]
name = "trajectory-collector"
version = "0.1.0"
description = "Ground-plane trajectories and speeds from tracked bounding boxes"
requires-python = ">=3.11"
# numpy and nothing else, on purpose. This package is here because the same code has
# been copied into several projects; the thing that makes it liftable out of this one
# is that it depends on nothing in it. Not `shared`, not the detection worker, and
# notably not opencv or a detection library either — projecting a point to the ground
# plane is linear algebra, and boxes arrive as arrays rather than as any library's
# detection type.
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
