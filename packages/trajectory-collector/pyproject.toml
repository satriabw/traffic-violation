[project]
name = "trajectory-collector"
version = "0.1.0"
description = "Ground-plane trajectories and speeds from tracked bounding boxes"
requires-python = ">=3.11"
# Two, and nothing from this repository. That last part is the point: this package is
# here because the same code has been copied into several projects by hand, and what
# makes it liftable back out is that it imports nothing from around it — not `shared`,
# not the detection worker, and no detection library either. Boxes arrive as arrays
# rather than as any library's detection type.
#
# OpenCV is here for one reason: calibrations are FileStorage documents, and reading
# one needs it. The headless build, because nothing here opens a window — a consumer
# that already has `opencv-python` should exclude this to avoid two builds in one
# environment. Nothing else uses it; projecting a point to the ground plane is linear
# algebra.
dependencies = ["numpy", "opencv-python-headless>=4.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
